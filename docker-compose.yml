version: "3"

services:
  postgres:
    image: postgres:14-alpine3.20
    container_name: postgres
    restart: unless-stopped
    volumes:
      - ./data/postgres/14/database_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret

  redis:
    image: redis:6.2-alpine3.20
    container_name: redis
    restart: unless-stopped
    volumes:
      - ./data/redis/database_data:/data

  greenlight-v3:
    entrypoint: [bin/start]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenlight-v3
    restart: unless-stopped
    env_file: .env
    ports:
      - 127.0.0.1:5050:3000
    logging:
      driver: journald
    depends_on:
      - postgres
      - redis
  external-record:
    build:
      context: ./external-record
      dockerfile: docker/Dockerfile
    container_name: external-record
    restart: unless-stopped
    env_file: ./external-record/docker/docker.env
    logging:
      driver: journald
    depends_on:
      - postgres
